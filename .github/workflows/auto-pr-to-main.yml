name: Auto PR — develop → main

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    name: Create PR to main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create PR from develop to main if not exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing_pr=$(gh pr list \
            --base main \
            --head develop \
            --state open \
            --json number \
            --jq '.[0].number' \
            2>/dev/null || echo "")

          if [ -n "$existing_pr" ]; then
            echo "PR #$existing_pr já existe. Nenhuma ação necessária."
            exit 0
          fi

          gh pr create \
            --base main \
            --head develop \
            --title "chore: promote develop → main" \
            --body "PR criado automaticamente após push na branch develop. Revise os checks e faça o merge para promover para main."

          echo "PR criado com sucesso."
