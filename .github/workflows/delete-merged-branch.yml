name: Delete merged branch

on:
  pull_request:
    types:
      - closed
    branches:
      - develop

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-branch:
    name: Delete merged source branch
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Delete source branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          case "$HEAD_BRANCH" in
            main|develop)
              echo "Branch protegida: $HEAD_BRANCH. Nenhuma exclusão será feita."
              exit 0
              ;;
          esac

          gh api \
            --method DELETE \
            "repos/$REPOSITORY/git/refs/heads/$HEAD_BRANCH"

          echo "Branch $HEAD_BRANCH excluída após merge em develop."